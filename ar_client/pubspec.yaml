name: ar_client
description: "AR Photo Scanner - Client app to scan photos and view AR videos"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2

  # Google Drive
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1
  http: ^1.2.0

  # Camera & Image Processing
  camera: ^0.11.0
  image: ^4.1.7

  # Video Player
  video_player: ^2.8.2

  # State Management
  flutter_riverpod: ^2.4.9

  # Utilities
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  crypto: ^3.0.3
  cloudinary_public: ^0.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
